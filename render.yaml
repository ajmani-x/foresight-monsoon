services:
  - type: web
    name: foresight-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: foresight-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: ""  # plain static HTML/CSS/JS -- no build step, no framework.
                       # The backend URL is chosen at runtime in app.js by
                       # hostname (localhost vs the deployed backend), not
                       # baked in at build time, so no env var is needed here.
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
